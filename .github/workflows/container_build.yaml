name: Build Container

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "**"

permissions:
  packages: write
  contents: read

jobs:
  build_docker:
    name: build docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Check publication script
        run: python3 -m unittest discover -s tests -v
      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          printf '%s' "$GHCR_TOKEN" |
          podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish versioned images
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export TAG="$GITHUB_REF_NAME"
          fi
          ./build_containers.sh --push
